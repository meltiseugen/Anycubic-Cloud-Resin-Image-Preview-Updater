[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "anycubic-file-updater"
version = "1.1.0"
description = "Offline Anycubic ZIP resin preview repair with print-data verification"
requires-python = ">=3.12"
dependencies = ["Pillow>=11,<14", "PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7", "ruff>=0.11"]

[project.gui-scripts]
anycubic-file-updater = "anycubic_file_updater.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
